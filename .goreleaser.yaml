# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj
---
version: 2

before:
  hooks:
    - go mod tidy
    # The archives are binary-only, so dependency licenses travel as one
    # generated file attached to the release (see release.extra_files).
    - >-
      sh -c "go run github.com/google/go-licenses/v2@v2.0.1
      report . --template notices.tpl > THIRD_PARTY_NOTICES.txt"

builds:
  - binary: git-dirty
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [binary]
    name_template: >-
      {{- .ProjectName }}_{{ .Os }}-{{ .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

changelog:
  sort: asc
  # The patterns match a Conventional Commits subject: the type, an optional
  # scope and an optional breaking-change "!". (?i) ignores the type's case, as
  # svu does, so a "Feat:" commit is listed with the features it is released as.
  # A commit goes to the first group, by order, that matches it; Others takes
  # the rest, such as merge commits.
  filters:
    exclude:
      - '(?i)^(docs|test)(\([^)]+\))?!?:'
  groups:
    - title: Features
      regexp: '(?i)^feat(\([^)]+\))?!?:'
      order: 0
    - title: Bug fixes
      regexp: '(?i)^fix(\([^)]+\))?!?:'
      order: 1
    - title: Refactoring
      regexp: '(?i)^refactor(\([^)]+\))?!?:'
      order: 2
    - title: Build
      regexp: '(?i)^build(\([^)]+\))?!?:'
      order: 3
    - title: CI
      regexp: '(?i)^ci(\([^)]+\))?!?:'
      order: 4
    - title: Chores
      regexp: '(?i)^chore(\([^)]+\))?!?:'
      order: 5
    - title: Others
      order: 999

signs:
  - cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

release:
  name_template: "{{.Tag}}"
  # The archives are binary-only and cannot carry extra files, so the project
  # licence and the third-party notices travel with the release itself.
  #
  # THIRD_PARTY_NOTICES.txt is generated by the go-licenses hook above from
  # every module linked into the binary: the charmbracelet TUI libraries and
  # their dependencies (MIT, BSD). Git storage is read by in-tree code. A glob
  # for a file no step produces would fail the release, so the hook and this
  # list stay together.
  extra_files:
    - glob: LICENSE
    - glob: THIRD_PARTY_NOTICES.txt
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
