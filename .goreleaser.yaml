# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj
---
version: 2

before:
  hooks:
    - go mod tidy
    # The archives are binary-only, so dependency licenses travel as one
    # generated file attached to the release (see release.extra_files).
    - >-
      sh -c "go run github.com/google/go-licenses/v2@v2.0.1
      report . --template notices.tpl > THIRD_PARTY_NOTICES.txt"

builds:
  - binary: git-dirty
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [binary]
    name_template: >-
      {{- .ProjectName }}_{{ .Os }}-{{ .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

signs:
  - cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

release:
  name_template: "{{.Tag}}"
  # The archives are binary-only and cannot carry extra files, so the project
  # licence and the third-party notices travel with the release itself.
  #
  # THIRD_PARTY_NOTICES.txt is generated by the go-licenses hook above from
  # every module linked into the binary: the charmbracelet TUI libraries and
  # their dependencies (MIT, BSD). Git storage is read by in-tree code. A glob
  # for a file no step produces would fail the release, so the hook and this
  # list stay together.
  extra_files:
    - glob: LICENSE
    - glob: THIRD_PARTY_NOTICES.txt
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
