#:schema https://mise.jdx.dev/schema/mise.json

# Go is not listed under [tools]: its version comes from the toolchain line in
# go.mod, which stays the single source of truth (CI's release job reads the same file
# through setup-go). Reading go.mod is off by default in mise, so it is enabled
# here for go alone.
[settings]
idiomatic_version_file_enable_tools = ["go"]

# Renovate's mise manager bumps these, so a version change is always a commit.
#
# govulncheck and gobco are built from source with the go.mod toolchain (the
# go: backend).
# golangci-lint is the prebuilt release: it must be built with at least the Go
# version of the code it checks, so check `golangci-lint version` when go.mod's
# toolchain moves ahead of it (2.15.0 is built with go1.27.0).
[tools]
# git is the tests' oracle, and its behaviour and wording change between
# releases, so the tests run with pinned gits: this one, the newest, for test
# and test-race, and the oldest supported for test-oldest-git. mise's registry
# has no git; the conda backend installs conda-forge's build, and only git's
# own commands reach PATH, not those of the package's dependencies. Linux and
# macOS only: on Windows mise starts a conda command through a .cmd launcher,
# which cmd.exe parses with its own quoting rules (os/exec's Command docs)
# and whose `call` expands `%` a second time, mangling arguments such as the
# tests' --format=%(objectmode). Windows keeps the git on its PATH, as CI's
# Windows job does.
"conda:git" = { version = "2.56.0", os = ["linux", "macos"] }
# Condition coverage (test-cov): whether each condition was seen both true and
# false, which go test -cover's statement count cannot tell.
"go:github.com/rillig/gobco" = "1.3.4"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
golangci-lint = "2.15.0"
goreleaser = "2.19.0"
hyperfine = "2.0.0"
# Reads the Claude Code hook's JSON input (lint:hook).
jq = "1.8.2"
# Runs the .pre-commit-config.yaml hooks.
prek = "0.5.9"
# Computes the next version tag from the commit messages (release).
svu = "3.4.1"

[tasks.build]
description = "Build for the current platform"
run = 'go build -trimpath -ldflags "-s -w" -o git-dirty .'

[tasks.test]
description = "Run all tests"
run = "go test ./..."

[tasks.test-race]
description = "Run tests with the race detector"
run = "go test -race ./..."

# The oldest git the tests support: the 2.39 line, which Debian 12 ships
# (2.39.2 is conda-forge's last build of it). An older git cannot build the
# fixtures: `git ls-tree --format` needs 2.36. A test that needs a newer git
# skips itself here. renovate.json keeps Renovate from bumping this pin. Like
# the newest, it is Linux and macOS only; on Windows the task runs with the
# git on PATH.
[tasks.test-oldest-git]
description = "Run all tests with the oldest supported git"
tools = { "conda:git" = { version = "2.39.2", os = ["linux", "macos"] } }
run = "go test ./..."

# Statement coverage first, then gobco's condition coverage, which is meant to
# go with it: gobco cannot see a function that has no conditions.
#
# gobco takes one package per run: for ./... it prints "nothing to instrument"
# and exits 0. So the task runs it per package, and assigns the list first
# because a pipeline would hide go list failing. gobco also type-checks every
# file in a directory whatever its build constraints (rillig/gobco#40), where
# proc_windows.go redeclares what proc_unix.go declares, and it has no option
# to skip a file. So it runs in a copy without that file, and without what it
# would otherwise copy again for each package.
[tasks.test-cov]
description = "Run tests with statement coverage (go test -cover) and condition coverage (gobco)"
run = '''
go test -cover ./...
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
cp -R . "$tmp"
rm -rf "$tmp/.git" "$tmp/dist" "$tmp/internal/action/proc_windows.go"
cd "$tmp"
pkgs=$(go list -f '.{% raw %}{{slice .ImportPath (len .Module.Path)}}{% endraw %}' ./...)
printf '%s\n' "$pkgs" | while read -r pkg; do
  gobco "$pkg"
done
'''

# .golangci.yml sets `fix: true`; the check overrides it, so CI fails on an
# issue instead of fixing a checkout nobody commits.
[tasks.lint]
description = "golangci-lint (linters and formatters) without fixing"
run = "golangci-lint run --fix=false"

[tasks."lint:fix"]
description = "golangci-lint, applying the fixes it can"
run = "golangci-lint run --fix"

# The pre-commit hook, as golangci-lint's own hook does it: prek stashes
# unstaged changes first, so the lines changed since HEAD are the staged ones.
[tasks."lint:staged"]
description = "golangci-lint --fix on the lines changed since HEAD (pre-commit)"
run = "golangci-lint run --new-from-rev HEAD --fix"

# The Claude Code PostToolUse hook (.claude/settings.json), which passes the
# tool call as JSON on stdin. It lints the package of the edited file; exit
# status 2 sends stderr back to Claude, so the remaining findings reach the
# agent that made the edit.
[tasks."lint:hook"]
description = "golangci-lint --fix on the edited file's package, for the Claude Code hook"
run = '''
file=$(jq -r '.tool_input.file_path // empty')
[ -n "$file" ] || exit 0
golangci-lint run --fix "$(dirname "$file")" >&2 || exit 2
'''

[tasks."lint:all"]
description = "Run every pre-commit hook on every file (prek)"
run = "prek run --all-files"

[tasks."hooks:install"]
description = "Install the prek pre-commit hook into .git/hooks"
run = "prek install"

# Reachability-aware: only fails on vulnerabilities this code can actually
# reach, unlike a plain dependency-version scan.
[tasks.vuln]
description = "Scan for reachable vulnerabilities with govulncheck"
run = "govulncheck ./..."

# The targets are .goreleaser.yaml's builds, so the list lives in one place.
# --skip=before leaves out the release's go mod tidy and license notices.
[tasks.build-all]
description = "Cross-compile the release targets into dist/"
run = "goreleaser build --snapshot --clean --skip=before"

# Warm-cache comparison with the bash script it replaces (scripts/git-dirty.sh),
# written to bench.md (gitignored). hyperfine discards the commands' output, so
# terminal rendering is not timed. BENCH_DIR overrides the scanned directory.
[tasks.bench]
description = "Benchmark against the bash script with hyperfine (warm cache)"
depends = ["build"]
run = '''
dir=${BENCH_DIR:-$HOME/Code}
old=scripts/git-dirty.sh
hyperfine --warmup 3 --runs 5 --export-markdown bench.md \
  -n "bash script" "$old $dir" \
  -n "bash script -p" "$old -p $dir" \
  -n "git-dirty" "./git-dirty --plain $dir"
'''

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf git-dirty dist/"

# --local keeps `mise upgrade` to this file; without it, it also rewrites the
# global mise config. Go itself is not bumped here: its version is the go.mod
# toolchain line, which Renovate moves.
[tasks.update]
description = "Update Go modules and mise tools to their latest versions"
run = ["go get -u -t ./...", "go mod tidy", "mise upgrade --bump --local"]

# Pushing the tag is the release: the release workflow builds, signs and
# publishes it. HEAD must be exactly origin/main. A tag carries the commits it
# points at, so tagging unpushed work would publish commits that are not on
# main and that CI has not run on. --tag.mode current reads only the tags HEAD
# contains; svu's default reads every branch, so a tag that is not on main,
# fetched or made locally, would set the version. --v0 keeps a breaking change
# to a minor bump while the version is 0.x. --tag.pattern 'v*' makes svu skip
# the old CalVer tags, which it would otherwise read as v2026.x.y; with no v
# tag yet, svu fails and the task stops, because the first semver tag is made
# by hand. A failed push deletes the local tag: svu reads local tags, so a tag
# left behind would be taken as the current version and the rerun would stop
# on it.
[tasks.release]
description = "Tag the next version and push it; the release workflow publishes it"
run = '''
if ! git diff --quiet || ! git diff --cached --quiet; then
  echo "Error: working tree is not clean" >&2
  exit 1
fi
if [ "$(git rev-parse --abbrev-ref HEAD)" != "main" ]; then
  echo "Error: not on main branch" >&2
  exit 1
fi
git fetch --quiet --tags origin main
if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
  echo "Error: main is not the same commit as origin/main" >&2
  exit 1
fi
tag=$(svu next --tag.mode current --v0 --tag.pattern 'v*')
# svu next prints the current tag when no commit calls for a new version.
if [ "$tag" = "$(svu current --tag.mode current --tag.pattern 'v*')" ]; then
  echo "Nothing to release: no commit since $tag calls for a new version" >&2
  exit 1
fi
echo "Releasing $tag..."
git tag -a "$tag" -m "Release $tag"
if ! git push origin "$tag"; then
  git tag -d "$tag" >/dev/null
  echo "Error: pushing $tag failed; the local tag was deleted" >&2
  exit 1
fi
echo "Tag $tag pushed. GitHub Actions will build, sign and publish the release."
'''

[tasks.all]
description = "Lint, race-enabled tests, tests with the oldest git, vulnerability scan and build: the CI gates"
depends = ["lint", "test-race", "test-oldest-git", "vuln", "build"]
