---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:

permissions: {}

# A newer push to the same ref supersedes the running checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Go and every tool come from mise.toml (Go through go.mod), so CI runs the same
# versions and the same tasks as `mise run all` locally. mise itself is pinned:
# an unpinned tool changes CI behaviour without a commit. Renovate bumps it via
# the customManagers:githubActionsVersions preset, and the tools via mise.toml.
env:
  # renovate: datasource=github-releases depName=jdx/mise
  MISE_VERSION: v2026.10.8

jobs:
  test:
    name: Build, vet and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # No job here performs authenticated git operations, so the checkout
          # token does not need to stay in the git config afterwards.
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8  # v5.1.2
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Lint (gofmt, go vet, staticcheck)
        run: mise run lint

      - name: Test with race detector
        run: mise run test-race

      - name: Build
        run: mise run build

  # Release binaries ship for macOS and Windows too, and the worktree
  # comparison (file modes, symlinks, path separators) is OS-sensitive. The
  # tests need only Go and git, both present on the hosted runners.
  test-os:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # No job here performs authenticated git operations, so the checkout
          # token does not need to stay in the git config afterwards.
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8  # v5.1.2
        with:
          version: ${{ env.MISE_VERSION }}

      - name: govulncheck
        run: mise run vuln
